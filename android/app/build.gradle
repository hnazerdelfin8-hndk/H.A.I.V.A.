plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.haiva.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.haiva.app'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.0.1'
    }

    // CI debug APKs use a dedicated application ID so a newly generated
    // debug artifact cannot collide with an older APK signed by another key.
    // Release/application production identity remains com.haiva.app.
    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
    }
}

kotlin { jvmToolchain(17) }
