plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.haiva.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.haiva.app'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '1.0.2'
    }

    // CI debug builds use a dedicated test application ID.
    // Release/application production identity remains com.haiva.app.
    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
    }
}

kotlin { jvmToolchain(17) }
