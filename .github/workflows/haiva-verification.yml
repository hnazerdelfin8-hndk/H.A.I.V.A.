name: HAIVA Canonical Verification Gate

on:
  push:
    branches: [haiva-core-brain]
  pull_request:
    branches: [haiva-core-brain]

permissions:
  contents: read

jobs:
  canonical-verification:
    name: Canonical verification through Stage 10H Full Autonomous H.A.I.V.A.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Run canonical verification
        run: npm run test:stage10
      # Canonical Stage 10 verification trigger marker
