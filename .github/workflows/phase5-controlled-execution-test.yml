name: HAIVA Phase 5 Controlled Execution Test

on:
  push:
    branches: [haiva-core-vnext]
  pull_request:
    branches: [haiva-core-vnext]

permissions:
  contents: read

jobs:
  controlled-execution-test:
    name: Controlled execution test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Run Phase 5 tests
        run: npm run test:phase5
