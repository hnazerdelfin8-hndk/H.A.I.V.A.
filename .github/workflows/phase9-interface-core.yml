name: HAIVA Phase 9 Interface Core

on:
  push:
    branches: [phase9-interface-core]
  pull_request:
    branches: [haiva-core-vnext]

permissions:
  contents: read

jobs:
  interface-core-test:
    name: Interface to core integration test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Run Phase 9 verification
        run: npm run test:phase9
