name: HAIVA Phase 7 Memory Test

on:
  push:
    branches: [haiva-core-vnext]
  pull_request:
    branches: [haiva-core-vnext]

permissions:
  contents: read

jobs:
  memory-test:
    name: Project memory test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run Phase 7 verification
        run: npm run test:phase7
