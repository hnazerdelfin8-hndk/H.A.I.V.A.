name: HAIVA Security Hardening Test

on:
  push:
    branches: [haiva-core-vnext]
  pull_request:
    branches: [haiva-core-vnext]

permissions:
  contents: read

jobs:
  security-hardening-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Run security hardening tests
        run: npm run test:security
