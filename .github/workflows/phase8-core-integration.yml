name: HAIVA Phase 8 Core Integration

on:
  push:
    branches: [phase8-core]
  pull_request:
    branches: [phase8-core]

permissions:
  contents: read

jobs:
  core-integration-test:
    name: Core integration test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run Phase 8 verification
        run: npm run test:phase8
