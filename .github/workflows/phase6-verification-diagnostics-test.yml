name: HAIVA Phase 6 Verification & Diagnostics

on:
  push:
    branches: [haiva-core-vnext]
  pull_request:
    branches: [haiva-core-vnext]

permissions:
  contents: read

concurrency:
  group: haiva-phase6-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verification-diagnostics-test:
    name: Verification and diagnostics test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Run Phase 6 tests
        run: npm run test:phase6
