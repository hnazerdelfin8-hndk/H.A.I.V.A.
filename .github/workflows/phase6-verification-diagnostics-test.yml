name: HAIVA Verification Gate

# Canonical verification gate for the agentic-core migration.
# Covers phases 2-6, security hardening, and package privacy metadata.

on:
  push:
    branches: [haiva-core-vnext]
  pull_request:
    branches: [haiva-core-vnext]

permissions:
  contents: read

jobs:
  verification:
    name: Full HAIVA verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Verify package metadata
        run: node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('./package.json','utf8')); if(p.private!==true) process.exit(1); console.log('package.private=true: PASS')"

      - name: Run full phase verification
        run: npm run test:phase6

      - name: Verification complete
        run: echo "HAIVA VERIFICATION GATE: PASS"
