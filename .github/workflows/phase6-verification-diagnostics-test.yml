name: HAIVA Phase 6 Verification & Diagnostics

on:
  push:
    branches: [haiva-core-vnext]
  pull_request:
    branches: [haiva-core-vnext]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: haiva-phase6-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verification-diagnostics-test:
    name: Verification and diagnostics test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Verify package metadata
        run: node -e "import('./package.json', { with: { type: 'json' } }).then(({default:p}) => { if (p.private !== true) process.exit(1); console.log('package.private=true: PASS') })"

      - name: Run Phase 6 tests
        run: npm run test:phase6

      - name: Verification complete
        run: echo "HAIVA PHASE 6 VERIFICATION: PASS"
