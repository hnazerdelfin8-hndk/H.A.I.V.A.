name: HAIVA Phase 4 Project Intelligence Test

on:
  push:
    branches: [haiva-core-vnext]
  pull_request:
    branches: [haiva-core-vnext]

jobs:
  project-intelligence-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Run Phase 4 tests
        run: npm run test:phase4
