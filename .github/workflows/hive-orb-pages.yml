name: Hive Orb Public Preview

on:
  push:
    branches: [main]
    paths:
      - 'native/hive-orb/**'
      - '.github/workflows/hive-orb-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: hive-orb-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Hive Orb site
        uses: actions/upload-pages-artifact@v3
        with:
          path: './native/hive-orb'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
