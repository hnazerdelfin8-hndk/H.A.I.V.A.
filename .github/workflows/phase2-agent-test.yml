name: HAIVA Canonical Verification Gate

on:
  push:
    branches: [haiva-core-vnext]
  pull_request:
    branches: [haiva-core-vnext]

permissions:
  contents: read

jobs:
  canonical-verification:
    name: Canonical verification through Phase 7
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run canonical verification
        run: npm run test:phase7
