<!-- H.A.I.V.A. UI -->

<section class="haiva-header">
  <h1>H.A.I.V.A.</h1>
  <p>HNazer Artificial Intelligence Voice Assistant</p>
</section>

<section class="haiva-orb-section">
  <div class="orb" id="orb">
    <div class="orb-text">HAIVA</div>
  </div>
</section>

<section class="conversation">

  <div class="label">STATUS</div>
  <div id="status">Ready</div>

  <div class="label">YOU SAID</div>
  <div id="transcript">
    Say "Yo HAIVA" to begin.
  </div>

  <div class="label">HAIVA</div>
  <div id="reply">
    Standing by.
  </div>

</section>

<button
  class="mic-button"
  id="micButton"
  type="button"
  aria-label="Start HAIVA">
  🎙️
</button>

<div class="hint">
  Tap once to activate conversation mode
</div>
