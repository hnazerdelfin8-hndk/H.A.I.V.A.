<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#030712">
  <title>H.A.I.V.A.</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#f5f5f5;color:#222}body{min-height:100vh}.app{width:min(100%,640px);min-height:100vh;margin:0 auto;padding:20px 16px;display:flex;flex-direction:column;gap:14px}.header,.status,.voice,.conversation,.settings{background:#fff;border:1px solid #ddd;border-radius:10px}.header{padding:18px}h1{margin:0;font-size:24px}.subtitle{margin:5px 0 0;color:#666;font-size:12px}.status{padding:12px 14px}.status-label{color:#777;font-size:11px;font-weight:bold}#haiva-status{margin-top:4px;font-size:14px}.voice{padding:20px;text-align:center}#orb{width:130px;height:130px;margin:0 auto 12px;border-radius:50%;border:2px solid #bbb;display:flex;align-items:center;justify-content:center;background:#fafafa}.core{width:48px;height:48px;border-radius:50%;background:#ddd}.orb-label,.orb-ring{display:none}#heard{min-height:24px;color:#555;font-size:13px}#activate-voice{width:64px;height:64px;border-radius:50%;border:1px solid #aaa;background:#fff;cursor:pointer;font-size:24px}#activate-voice:active,#send-message:active{transform:scale(.96)}.conversation{padding:16px;min-height:180px;max-height:38vh;overflow:auto}.conversation-head{display:flex;justify-content:space-between;margin-bottom:14px}.conversation-title{font-size:12px;font-weight:bold}.online{font-size:11px;color:#555}.bubble-block{margin-bottom:14px}.label{color:#777;font-size:10px;font-weight:bold;margin-bottom:5px}.bubble{padding:10px;border:1px solid #e0e0e0;border-radius:7px;min-height:38px;white-space:pre-wrap;word-break:break-word;font-size:13px}.chat-form{display:flex;gap:8px}#chat-input{flex:1;min-width:0;padding:13px;border:1px solid #bbb;border-radius:8px;background:#fff;color:#222;outline:none}#send-message{width:54px;border:1px solid #999;border-radius:8px;background:#fff;cursor:pointer;font-size:18px}.settings{padding:12px}#settings-toggle{width:100%;padding:9px;border:1px solid #ccc;border-radius:7px;background:#fafafa;cursor:pointer}#settings-panel{display:none;margin-top:10px}#settings-panel.open{display:block}.setting-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eee;font-size:12px}.setting-value{color:#666}button:disabled,input:disabled{opacity:.55;cursor:not-allowed}

/* H.A.I.V.A. Core UI/UX */
:root{--haiva-green:#00ff8c;--haiva-bg:#030504}
html,body{background:radial-gradient(ellipse at center,#06120c 0%,#030504 72%);color:#eafff4}
body{overflow:hidden}
.app{position:relative;width:100%;max-width:none;height:100vh;min-height:100vh;margin:0;padding:0 16px;display:flex;flex-direction:column;align-items:center;gap:0;background:transparent}
.header,.status{display:none!important}
.haiva-topbar{position:relative;z-index:20;width:min(100%,640px);height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 4px}
.haiva-brand{font:700 15px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.32em;color:rgba(0,255,140,.82);text-shadow:0 0 12px rgba(0,255,140,.4)}
.haiva-dot{font-size:7px;margin-left:7px;vertical-align:middle}
.haiva-settings-btn{width:40px;height:40px;border-radius:50%;border:1px solid rgba(0,255,140,.25);background:rgba(0,255,140,.045);color:rgba(0,255,140,.8);font-size:18px}
.haiva-core{position:relative;flex:1;width:100%;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.haiva-orb{position:relative;width:min(88vw,500px);height:min(88vw,500px);max-height:62vh;aspect-ratio:1;border-radius:50%;overflow:visible}
#haiva-core-canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.haiva-orb-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.haiva-orb-mark{width:48px;height:48px;border:1px solid rgba(0,255,140,.25);border-radius:50%;display:grid;place-items:center;color:rgba(220,255,240,.8);font:500 20px/1 ui-monospace,SFMono-Regular,Menlo,monospace;text-shadow:0 0 18px rgba(0,255,140,.65);background:rgba(0,20,12,.22);backdrop-filter:blur(4px)}
.haiva-orb-state{margin-top:12px;color:rgba(0,255,140,.52);font:600 9px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.32em}
.haiva-feedback{position:absolute;bottom:10%;max-width:86%;text-align:center;color:rgba(210,255,235,.48);font:11px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}
.haiva-mic-btn{font-size:15px!important}.haiva-mic-btn.active{background:rgba(0,255,140,.18);box-shadow:0 0 18px rgba(0,255,140,.32);border-color:rgba(0,255,140,.8)}
.haiva-conversation{position:absolute!important;left:-9999px!important;width:1px!important;height:1px!important;overflow:hidden!important;opacity:0!important}
.haiva-chatbar{position:relative;z-index:20;width:min(100%,560px);margin:0 auto 18px;display:flex;align-items:center;gap:8px;padding:7px 7px 7px 17px;border:1px solid rgba(0,255,140,.2);border-radius:30px;background:rgba(6,18,12,.72);box-shadow:0 8px 35px rgba(0,0,0,.35),inset 0 1px rgba(255,255,255,.035);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.haiva-chatbar #chat-input{padding:10px 0;border:0;background:transparent;color:#eafff4;font:13px ui-monospace,SFMono-Regular,Menlo,monospace}
.haiva-chatbar #chat-input::placeholder{color:rgba(0,255,140,.32)}
.iconBtn{width:38px;height:38px;border-radius:50%;border:1px solid rgba(0,255,140,.25);background:rgba(0,255,140,.045);color:var(--haiva-green);display:grid;place-items:center;font-size:15px}
.iconBtn:hover,.iconBtn:focus-visible{background:rgba(0,255,140,.12);box-shadow:0 0 14px rgba(0,255,140,.2)}
.haiva-settings-panel{position:absolute;z-index:30;right:16px;top:62px;width:min(290px,calc(100% - 32px));padding:14px;border:1px solid rgba(0,255,140,.18);border-radius:18px;background:rgba(3,12,8,.88);box-shadow:0 18px 55px rgba(0,0,0,.5);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);display:none}
.haiva-settings-panel.open{display:block}
.haiva-settings-panel .setting-row{color:rgba(220,255,240,.72);border-color:rgba(0,255,140,.08)}
.sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}
@media(max-height:650px){.haiva-orb{width:min(72vw,390px);max-height:55vh}.haiva-feedback{bottom:6%}.haiva-voice-trigger{bottom:0}}
</style>
</head>
<body data-haiva-state="loading">
  <main class="app">
    <header class="haiva-topbar">
      <div class="haiva-brand">H.A.I.V.A.<span class="haiva-dot">●</span></div>
      <button id="settings-toggle" class="haiva-settings-btn" type="button" aria-expanded="false" aria-label="Open settings">⚙</button>
    </header>

    <section class="haiva-core" aria-label="H.A.I.V.A. core">
      <div id="orb" class="haiva-orb">
        <canvas id="haiva-core-canvas" aria-hidden="true"></canvas>
        <div class="haiva-orb-center">
          <div class="haiva-orb-mark">H</div>
          <div id="haiva-orb-state" class="haiva-orb-state">BOOTING</div>
        </div>
      </div>
      <div id="haiva-status" class="sr-only">BOOTING</div>
      <div id="heard" class="haiva-feedback">Initializing H.A.I.V.A. core…</div>
    </section>

    <section class="conversation haiva-conversation" id="conversation" aria-label="Conversation">
      <div class="bubble-block"><div class="label">YOU</div><div class="bubble" id="transcript">—</div></div>
      <div class="bubble-block"><div class="label">H.A.I.V.A.</div><div class="bubble" id="reply">Core initializing…</div></div>
    </section>

    <form class="chat-form haiva-chatbar" id="chat-form">
      <input id="chat-input" type="text" autocomplete="off" placeholder="Message H.A.I.V.A…" aria-label="Message" disabled>
      <button id="activate-voice" class="iconBtn haiva-mic-btn" type="button" aria-label="Activate H.A.I.V.A." aria-pressed="false" disabled>🎙</button>
      <button id="send-message" class="iconBtn" type="submit" aria-label="Send" disabled>➤</button>
    </form>

    <section class="settings haiva-settings-panel" id="settings-panel" aria-label="Settings">
      <div class="setting-row"><span>Voice mode</span><span class="setting-value" id="voice-setting">Duplex</span></div>
      <div class="setting-row"><span>Wake word</span><span class="setting-value">Yo, H.A.I.V.A.</span></div>
      <div class="setting-row"><span>Microphone</span><span class="setting-value" id="mic-setting">Checking…</span></div>
    </section>
  </main>
  <script type="module" src="./core/boot.js"></script>
</body>
</html>
