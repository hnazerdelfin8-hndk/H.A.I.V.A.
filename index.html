<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#03060d">
  <meta name="description" content="H.A.I.V.A. — Hnazer Artificial Intelligence Voice Assistant">
  <title>H.A.I.V.A. — Voice Assistant</title>
  <style>
    :root{color-scheme:dark;--bg:#03060d;--panel:rgba(9,15,27,.72);--line:rgba(137,176,220,.16);--text:#f4f8ff;--muted:#7e8da5;--blue:#38a7ff;--cyan:#2de4e0;--purple:#a56cff;--red:#ff4d57}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{min-height:100vh;overflow-x:hidden;background:radial-gradient(circle at 50% 18%,rgba(33,109,196,.14),transparent 32%),#03060d}
    button,input{font:inherit;color:inherit}.app{width:min(100%,560px);min-height:100vh;margin:auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column}
    .topbar{display:flex;align-items:center;justify-content:space-between;padding:2px 2px 12px}.brand h1{font-size:16px;letter-spacing:4px;margin:0}.brand p{font-size:8px;color:var(--muted);letter-spacing:1.2px;margin:4px 0 0}.icon-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.025);display:grid;place-items:center;color:#aab8cb;cursor:pointer}
    .hero{border:1px solid var(--line);border-radius:26px;background:linear-gradient(180deg,rgba(10,20,36,.6),rgba(4,9,17,.4));padding:16px;position:relative;overflow:hidden}.status-row{display:flex;justify-content:center}.status-pill{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:6px 11px;font-size:9px;font-weight:700;letter-spacing:2px;color:#9eb0c8;background:rgba(0,0,0,.22)}.status-dot{width:6px;height:6px;border-radius:50%;background:var(--blue);box-shadow:0 0 10px var(--blue)}
    .orb-wrap{height:235px;display:grid;place-items:center;position:relative}.orb{width:172px;height:172px;border-radius:50%;position:relative;display:grid;place-items:center;border:1px solid rgba(56,167,255,.65);box-shadow:0 0 30px rgba(56,167,255,.18),inset 0 0 40px rgba(56,167,255,.08);transition:transform .2s}.orb:before,.orb:after{content:"";position:absolute;border-radius:50%;inset:13px;border:1px solid rgba(56,167,255,.3);animation:spin 8s linear infinite}.orb:after{inset:27px;border-style:dashed;animation:spinReverse 12s linear infinite}.core{width:68px;height:68px;border-radius:50%;background:radial-gradient(circle,#c9efff 0,#45b8ff 20%,#1673d2 45%,rgba(22,115,210,.08) 72%,transparent 73%);box-shadow:0 0 28px rgba(56,167,255,.75),0 0 70px rgba(56,167,255,.3);animation:breathe 2.8s ease-in-out infinite}.orb-label{position:absolute;bottom:15px;font-size:9px;letter-spacing:3px;color:#a9bdd5}
    .voice-copy{text-align:center}.voice-copy .message{margin:5px auto 0;min-height:24px;font-size:13px;line-height:1.45;color:#dbe8f7}.mic{width:60px;height:60px;border-radius:50%;border:1px solid rgba(56,167,255,.6);background:rgba(15,28,48,.8);display:grid;place-items:center;margin:10px auto 0;cursor:pointer;box-shadow:0 0 24px rgba(56,167,255,.13);transition:.2s}.mic:active{transform:scale(.94)}.mic span{font-size:23px}.mic.active{box-shadow:0 0 30px rgba(45,228,224,.35);border-color:var(--cyan)}
    .conversation{flex:1;margin-top:12px;border:1px solid var(--line);border-radius:20px;background:rgba(7,13,24,.62);padding:14px;min-height:190px;overflow:auto}.label{font-size:8px;letter-spacing:2px;color:#62758d}.bubble{margin:6px 0 13px;padding:10px 12px;border-radius:13px;background:rgba(255,255,255,.035);font-size:12px;line-height:1.5;color:#cbd9e8;min-height:38px;white-space:pre-wrap}.bubble.user{background:rgba(56,167,255,.08);border:1px solid rgba(56,167,255,.1)}.bubble.thinking{color:#9eb0c8;font-style:italic}
    .chat-form{display:flex;gap:8px;margin-top:10px}.chat-input{flex:1;min-width:0;border:1px solid var(--line);border-radius:17px;background:rgba(7,13,24,.85);padding:13px 14px;outline:none}.chat-input:focus{border-color:rgba(56,167,255,.55);box-shadow:0 0 18px rgba(56,167,255,.08)}.send-btn{width:48px;border:1px solid rgba(56,167,255,.45);border-radius:17px;background:rgba(56,167,255,.1);cursor:pointer}.send-btn:disabled{opacity:.45;cursor:not-allowed}
    .settings-panel{display:none;margin-top:10px;border:1px solid var(--line);border-radius:18px;background:rgba(7,13,24,.95);padding:14px}.settings-panel.open{display:block}.setting-row{display:flex;align-items:center;justify-content:space-between;padding:11px 2px;border-bottom:1px solid rgba(137,176,220,.08);font-size:12px}.setting-row:last-child{border-bottom:0}.setting-value{font-size:10px;color:var(--muted)}
    body[data-haiva-state="listening"] .orb{border-color:rgba(45,228,224,.85);box-shadow:0 0 48px rgba(45,228,224,.25)}body[data-haiva-state="listening"] .core{background:radial-gradient(circle,#e5ffff 0,#2de4e0 22%,#168fa0 48%,transparent 73%);box-shadow:0 0 30px rgba(45,228,224,.9)}body[data-haiva-state="listening"] .status-dot{background:var(--cyan);box-shadow:0 0 12px var(--cyan)}body[data-haiva-state="thinking"] .orb{border-color:rgba(165,108,255,.8);box-shadow:0 0 52px rgba(165,108,255,.22)}body[data-haiva-state="thinking"] .core{background:radial-gradient(circle,#f0e5ff 0,#a56cff 23%,#6231b9 50%,transparent 74%);box-shadow:0 0 38px rgba(165,108,255,.8)}body[data-haiva-state="thinking"] .status-dot{background:var(--purple);box-shadow:0 0 12px var(--purple)}body[data-haiva-state="speaking"] .core{animation:breathe .55s ease-in-out infinite}body[data-haiva-state="error"] .orb{border-color:rgba(255,77,87,.8);box-shadow:0 0 45px rgba(255,77,87,.2)}body[data-haiva-state="error"] .status-dot{background:var(--red);box-shadow:0 0 12px var(--red)}
    @keyframes breathe{0%,100%{transform:scale(.94);opacity:.82}50%{transform:scale(1.08);opacity:1}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes spinReverse{to{transform:rotate(-360deg)}}
    @media(max-height:700px){.orb-wrap{height:195px}.orb{width:145px;height:145px}.core{width:58px;height:58px}}
  </style>
</head>
<body data-haiva-state="booting">
  <main class="app">
    <header class="topbar">
      <div class="brand"><h1>H.A.I.V.A.</h1><p>HNAZER ARTIFICIAL INTELLIGENCE VOICE ASSISTANT</p></div>
      <button class="icon-btn" id="settings-toggle" aria-label="Settings" aria-expanded="false">⚙</button>
    </header>

    <section class="hero" aria-label="H.A.I.V.A. voice control">
      <div class="status-row"><div class="status-pill"><span class="status-dot"></span><span id="haiva-status">BOOTING</span></div></div>
      <div class="orb-wrap"><div class="orb" id="orb"><div class="core"></div><div class="orb-label">H.A.I.V.A.</div></div></div>
      <div class="voice-copy"><div class="message" id="heard">Initializing H.A.I.V.A. core…</div><button class="mic" id="activate-voice" type="button" aria-label="Activate H.A.I.V.A." aria-pressed="false"><span>🎙️</span></button></div>
    </section>

    <section class="conversation" aria-label="Conversation" id="conversation">
      <div class="label">YOU</div><div class="bubble user" id="transcript">—</div>
      <div class="label">H.A.I.V.A.</div><div class="bubble" id="reply">Standing by, Master.</div>
    </section>

    <form class="chat-form" id="chat-form">
      <input class="chat-input" id="chat-input" type="text" autocomplete="off" placeholder="Type a message..." aria-label="Message">
      <button class="send-btn" id="send-message" type="submit" aria-label="Send">➤</button>
    </form>

    <section class="settings-panel" id="settings-panel" aria-label="Settings">
      <div class="setting-row"><span>Voice mode</span><span class="setting-value" id="voice-setting">Tap + Wake Word</span></div>
      <div class="setting-row"><span>Wake word</span><span class="setting-value">Yo, H.A.I.V.A.</span></div>
      <div class="setting-row"><span>Microphone</span><span class="setting-value" id="mic-setting">Checking…</span></div>
    </section>
  </main>
  <script type="module" src="./core/app.js"></script>
</body>
</html>
