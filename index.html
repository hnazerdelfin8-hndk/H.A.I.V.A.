<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#030408">
<title>H.A.I.V.A.</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
}

body{
  min-height:100vh;
  overflow:hidden;
  display:flex;
  justify-content:center;
  align-items:center;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  background:
    radial-gradient(circle at 50% 42%,
    #172033 0%,
    #0a0e18 42%,
    #030408 100%);
}

#haiva-app{
  width:100%;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:12px;
}

.haiva-card{
  width:100%;
  max-width:480px;
  height:min(720px,94vh);
  position:relative;
  overflow:hidden;

  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;

  border:1px solid rgba(255,255,255,.1);
  border-radius:32px;
  background:rgba(255,255,255,.045);

  backdrop-filter:blur(28px);
  -webkit-backdrop-filter:blur(28px);

  box-shadow:0 35px 100px rgba(0,0,0,.55);
}

.logo{
  margin-bottom:50px;
  font-size:27px;
  font-weight:700;
  letter-spacing:7px;
  text-shadow:0 0 25px rgba(255,255,255,.18);
}

.core-wrapper{
  width:220px;
  height:220px;
  position:relative;

  display:flex;
  justify-content:center;
  align-items:center;
}

.core-ring{
  position:absolute;
  width:210px;
  height:210px;
  border-radius:50%;
  border:1px solid rgba(150,190,255,.18);
  animation:ringPulse 3s ease-in-out infinite;
}

.core-ring:before,
.core-ring:after{
  content:"";
  position:absolute;
  inset:15px;
  border-radius:50%;
  border:1px solid rgba(150,190,255,.1);
}

.core{
  width:165px;
  height:165px;
  position:relative;

  display:flex;
  justify-content:center;
  align-items:center;

  border-radius:50%;

  background:
    radial-gradient(circle,
    rgba(255,255,255,.98) 0%,
    rgba(180,210,255,.75) 8%,
    rgba(90,145,255,.28) 30%,
    rgba(40,80,150,.08) 52%,
    transparent 72%);

  box-shadow:
    0 0 35px rgba(120,170,255,.35),
    inset 0 0 35px rgba(255,255,255,.12);

  animation:corePulse 3s ease-in-out infinite;
}

.core:before{
  content:"";
  width:58px;
  height:58px;
  border-radius:50%;

  background:
    radial-gradient(circle,
    #fff 0%,
    rgba(220,235,255,.95) 45%,
    rgba(130,180,255,.35) 100%);

  box-shadow:0 0 35px rgba(255,255,255,.85);
}

#haiva-status{
  margin-top:40px;
  min-height:20px;

  font-size:13px;
  font-weight:700;
  letter-spacing:4px;
  text-align:center;
}

#haiva-response{
  width:88%;
  min-height:25px;
  margin-top:18px;

  text-align:center;
  font-size:14px;
  line-height:1.5;
  opacity:.75;
}

.instruction{
  margin-top:28px;
  width:90%;
  text-align:center;
  font-size:13px;
  opacity:.55;
}

#activate-voice{
  border:1px solid rgba(255,255,255,.16);
  border-radius:999px;
  padding:13px 23px;

  color:#fff;
  background:rgba(255,255,255,.07);

  font-size:13px;
  font-weight:600;
  cursor:pointer;
}

#activate-voice.active{
  background:rgba(100,160,255,.18);
  box-shadow:0 0 30px rgba(100,160,255,.25);
}

/* LISTENING */

body.listening .core{
  animation:listeningPulse .8s ease-in-out infinite;
  box-shadow:
    0 0 80px rgba(80,170,255,.75),
    inset 0 0 40px rgba(120,190,255,.25);
}

body.listening .core-ring{
  animation:listeningRing 1s linear infinite;
}

/* THINKING */

body.thinking .core{
  animation:thinkingPulse .45s ease-in-out infinite;
  box-shadow:0 0 95px rgba(175,100,255,.75);
}

/* SPEAKING */

body.speaking .core{
  animation:speakingPulse .35s ease-in-out infinite;
  box-shadow:0 0 100px rgba(255,165,90,.8);
}

/* ERROR */

body.error .core{
  animation:errorPulse .6s ease-in-out infinite;
  box-shadow:0 0 90px rgba(255,70,70,.75);
}

@keyframes corePulse{
  0%,100%{transform:scale(1);opacity:.75}
  50%{transform:scale(1.07);opacity:1}
}

@keyframes ringPulse{
  0%,100%{transform:scale(.96);opacity:.35}
  50%{transform:scale(1.08);opacity:.8}
}

@keyframes listeningPulse{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.13)}
}

@keyframes listeningRing{
  from{transform:rotate(0deg) scale(.96)}
  to{transform:rotate(360deg) scale(1.08)}
}

@keyframes thinkingPulse{
  0%{transform:scale(1) rotate(0deg)}
  50%{transform:scale(1.09) rotate(180deg)}
  100%{transform:scale(1) rotate(360deg)}
}

@keyframes speakingPulse{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.18)}
}

@keyframes errorPulse{
  0%,100%{opacity:.55}
  50%{opacity:1}
}

@media(max-width:480px){

  .haiva-card{
    height:95vh;
    border-radius:28px;
  }

  .logo{
    margin-bottom:42px;
    font-size:23px;
    letter-spacing:5px;
  }

  .core-wrapper{
    width:190px;
    height:190px;
  }

  .core-ring{
    width:180px;
    height:180px;
  }

  .core{
    width:145px;
    height:145px;
  }

  .core:before{
    width:52px;
    height:52px;
  }
}
</style>
</head>

<body>

<div id="haiva-app">

  <main class="haiva-card">

    <div class="logo">H.A.I.V.A.</div>

    <div class="core-wrapper">
      <div class="core-ring"></div>
      <div class="core"></div>
    </div>

    <div id="haiva-status">READY</div>

    <div id="haiva-response">
      Press Activate Voice once.
    </div>

    <div class="instruction">

      <button id="activate-voice" type="button">
        🎙️ Activate Voice
      </button>

      <p>
        Say <strong>"Yi, H.A.I.V.A."</strong>
        to activate a command.
      </p>

    </div>

  </main>

</div>

<script>

/* =========================================
   H.A.I.V.A. SINGLE-FILE VOICE TEST
========================================= */

const statusElement =
  document.getElementById("haiva-status");

const responseElement =
  document.getElementById("haiva-response");

const button =
  document.getElementById("activate-voice");


let recognition = null;
let voiceActive = false;
let commandMode = false;
let recognitionRunning = false;


/* =========================================
   STATE
========================================= */

function setState(state){

  document.body.className =
    state.toLowerCase();

  statusElement.textContent =
    state;

}


/* =========================================
   RESPONSE
========================================= */

function showResponse(text){

  responseElement.textContent =
    text;

}


/* =========================================
   SPEAK
========================================= */

function speak(text){

  return new Promise(resolve => {

    if(!("speechSynthesis" in window)){

      resolve();
      return;

    }

    speechSynthesis.cancel();

    setState("SPEAKING");

    showResponse(text);

    const utterance =
      new SpeechSynthesisUtterance(text);

    utterance.lang = "en-US";
    utterance.rate = 0.95;
    utterance.pitch = 1;
    utterance.volume = 1;


    utterance.onend = () => {

      if(voiceActive){

        commandMode = false;

        setState("LISTENING");

        showResponse(
          'Listening for "Yi, H.A.I.V.A."'
        );

        restartRecognition();

      }

      resolve();

    };


    utterance.onerror = () => {

      if(voiceActive){

        commandMode = false;

        setState("LISTENING");

        restartRecognition();

      }

      resolve();

    };


    speechSynthesis.speak(
      utterance
    );

  });

}


/* =========================================
   NORMALIZE
========================================= */

function normalize(text){

  return text
    .toLowerCase()
    .replace(/[.,!?]/g,"")
    .replace(/\s+/g," ")
    .trim();

}


/* =========================================
   WAKE WORD
========================================= */

function detectWakeWord(text){

  const wakeWords = [

    "yi haiva",
    "hey haiva",
    "hi haiva",
    "yo haiva",
    "haiva"

  ];

  return wakeWords.some(
    word => text.includes(word)
  );

}


/* =========================================
   REMOVE WAKE WORD
========================================= */

function removeWakeWord(text){

  const wakeWords = [

    "yi haiva",
    "hey haiva",
    "hi haiva",
    "yo haiva",
    "haiva"

  ];

  let result = text;

  for(const word of wakeWords){

    result =
      result.replace(word,"");

  }

  return result.trim();

}


/* =========================================
   COMMAND
========================================= */

async function processCommand(command){

  command =
    normalize(command);


  if(!command){

    commandMode = true;

    setState("LISTENING");

    await speak(
      "Yes, Master. I'm listening."
    );

    return;

  }


  setState("THINKING");

  showResponse(
    "Thinking..."
  );


  let answer;


  if(
    command.includes("hello") ||
    command.includes("hi")
  ){

    answer =
      "Hello, Master. How can I help you?";

  }

  else if(
    command.includes("who are you")
  ){

    answer =
      "I am H.A.I.V.A., your artificial intelligence voice assistant.";

  }

  else if(
    command.includes("what time") ||
    command.includes("time")
  ){

    answer =
      "The current time is " +
      new Date().toLocaleTimeString(
        [],
        {
          hour:"numeric",
          minute:"2-digit"
        }
      ) +
      ".";

  }

  else {

    answer =
      "I heard you say " +
      command +
      ", Master.";

  }


  await speak(answer);

}


/* =========================================
   SPEECH RESULT
========================================= */

function handleSpeech(event){

  let transcript = "";


  for(
    let i = event.resultIndex;
    i < event.results.length;
    i++
  ){

    transcript +=
      event.results[i][0].transcript;

  }


  transcript =
    normalize(transcript);


  if(!transcript){
    return;
  }


  console.log(
    "H.A.I.V.A. heard:",
    transcript
  );


  /*
   * WAKE-WORD MODE
   */

  if(!commandMode){

    if(
      detectWakeWord(transcript)
    ){

      commandMode = true;

      setState("LISTENING");

      const command =
        removeWakeWord(transcript);


      if(command){

        processCommand(command);

      }
      else{

        speak(
          "Yes, Master. I'm listening."
        );

      }

    }

    return;

  }


  /*
   * COMMAND MODE
   */

  processCommand(
    transcript
  );

}


/* =========================================
   START
========================================= */

function startRecognition(){

  if(!recognition){
    return;
  }

  if(!voiceActive){
    return;
  }

  if(recognitionRunning){
    return;
  }


  try{

    recognition.start();

  }
  catch(error){

    console.log(
      "Recognition start:",
      error
    );

  }

}


/* =========================================
   RESTART
========================================= */

function restartRecognition(){

  if(!voiceActive){
    return;
  }


  setTimeout(
    startRecognition,
    700
  );

}


/* =========================================
   SETUP
========================================= */

function setupRecognition(){

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  if(!SpeechRecognition){

    setState(
      "VOICE UNAVAILABLE"
    );

    showResponse(
      "Speech Recognition is unavailable."
    );

    return false;

  }


  recognition =
    new SpeechRecognition();


  recognition.lang =
    "en-US";


  recognition.continuous =
    true;


  recognition.interimResults =
    false;


  recognition.onstart =
    () => {

      recognitionRunning = true;

      setState("LISTENING");

      showResponse(
        'Listening for "Yi, H.A.I.V.A."'
      );

    };


  recognition.onresult =
    handleSpeech;


  recognition.onerror =
    event => {

      console.warn(
        "Speech recognition error:",
        event.error
      );


      recognitionRunning =
        false;


      if(
        event.error ===
        "not-allowed"
      ){

        voiceActive = false;

        setState(
          "MICROPHONE DENIED"
        );

        showResponse(
          "Allow microphone access in Chrome."
        );

        button.classList.remove(
          "active"
        );

        button.textContent =
          "🎙️ Activate Voice";

      }

    };


  recognition.onend =
    () => {

      recognitionRunning =
        false;


      /*
       * AUTOMATIC RESTART
       *
       * No second button press.
       */

      if(voiceActive){

        restartRecognition();

      }

    };


  return true;

}


/* =========================================
   ONE-TAP ACTIVATION
========================================= */

button.addEventListener(
  "click",
  async () => {

    if(voiceActive){
      return;
    }


    const ready =
      setupRecognition();


    if(!ready){
      return;
    }


    try{

      /*
       * Request microphone permission
       * from the button gesture.
       */

      if(
        navigator.mediaDevices &&
        navigator.mediaDevices.getUserMedia
      ){

        const stream =
          await navigator.mediaDevices
            .getUserMedia({
              audio:true
            });


        stream
          .getTracks()
          .forEach(
            track =>
              track.stop()
          );

      }


      voiceActive = true;

      commandMode = false;


      button.classList.add(
        "active"
      );

      button.textContent =
        "🎙️ Listening";


      /*
       * First confirmation.
       */

      await speak(
        "H.A.I.V.A. is ready."
      );


      /*
       * IMPORTANT:
       * No STANDBY.
       */

      commandMode = false;

      setState("LISTENING");

      showResponse(
        'Listening for "Yi, H.A.I.V.A."'
      );


      startRecognition();

    }
    catch(error){

      console.error(
        "Activation error:",
        error
      );


      voiceActive = false;

      setState(
        "MICROPHONE ERROR"
      );

      showResponse(
        "Microphone access is required."
      );

    }

  }
);


/* =========================================
   INITIAL
========================================= */

setState("READY");

</script>

</body>
</html>
