<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>H.A.I.V.A.</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #050505;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app {
      width: 100%;
      max-width: 500px;
      min-height: 100vh;
      padding: 35px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      text-align: center;
      margin-top: 30px;
    }

    .logo h1 {
      margin: 0;
      font-size: 42px;
      letter-spacing: 6px;
    }

    .logo p {
      margin-top: 10px;
      color: #aaa;
      font-size: 13px;
      letter-spacing: 2px;
    }

    .orb {
      width: 190px;
      height: 190px;
      border-radius: 50%;
      border: 2px solid #777;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      box-shadow: 0 0 35px rgba(255,255,255,0.15);
      transition: 0.3s;
    }

    .orb::before {
      content: "";
      width: 130px;
      height: 130px;
      border-radius: 50%;
      border: 1px solid #555;
      position: absolute;
    }

    .orb.active {
      animation: pulse 1.2s infinite;
      box-shadow: 0 0 50px rgba(255,255,255,0.45);
    }

    .orb.thinking {
      animation: thinking 0.8s infinite;
      box-shadow: 0 0 70px rgba(100,180,255,0.5);
    }

    .orb-text {
      z-index: 2;
      font-size: 18px;
      letter-spacing: 3px;
    }

    @keyframes pulse {
      0% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.06);
      }

      100% {
        transform: scale(1);
      }
    }

    @keyframes thinking {
      0% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.04);
      }

      100% {
        transform: scale(1);
      }
    }

    .conversation {
      width: 100%;
      min-height: 180px;
      text-align: center;
      font-size: 15px;
      line-height: 1.5;
    }

    .label {
      color: #777;
      font-size: 11px;
      letter-spacing: 2px;
      margin-bottom: 7px;
    }

    #status {
      color: #aaa;
      margin-bottom: 18px;
    }

    #transcript,
    #reply {
      min-height: 40px;
      padding: 0 10px;
      margin-bottom: 15px;
    }

    #reply {
      color: #ddd;
    }

    .mic-button {
      width: 85px;
      height: 85px;
      border-radius: 50%;
      border: 2px solid white;
      background: transparent;
      color: white;
      font-size: 32px;
      cursor: pointer;
      margin-bottom: 30px;
    }

    .mic-button:active {
      transform: scale(0.94);
    }

    .mic-button.listening {
      animation: micPulse 1s infinite;
    }

    .mic-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    @keyframes micPulse {
      0% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.08);
      }

      100% {
        transform: scale(1);
      }
    }
  </style>
</head>

<body>

  <main class="app">

    <section class="logo">
      <h1>H.A.I.V.A.</h1>
      <p>HNazer Artificial Intelligence Voice Assistant</p>
    </section>

    <section>
      <div class="orb" id="orb">
        <div class="orb-text">HAIVA</div>
      </div>
    </section>

    <section class="conversation">

      <div class="label">STATUS</div>
      <div id="status">Ready</div>

      <div class="label">YOU SAID</div>
      <div id="transcript">
        Press the microphone and speak.
      </div>

      <div class="label">HAIVA</div>
      <div id="reply">
        Waiting for your command.
      </div>

    </section>

    <button
      class="mic-button"
      id="micButton"
      aria-label="Microphone">
      🎙️
    </button>

  </main>

  <script>
    const micButton = document.getElementById("micButton");
    const orb = document.getElementById("orb");
    const status = document.getElementById("status");
    const transcript = document.getElementById("transcript");
    const reply = document.getElementById("reply");

    const SpeechRecognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;

    let recognition;
    let listening = false;

    async function askHAIVA(message) {

      status.textContent = "Thinking...";
      orb.classList.remove("active");
      orb.classList.add("thinking");

      try {

        const response = await fetch("/api/chat", {

          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            message: message
          })

        });

        const data = await response.json();

        if (!response.ok) {

          throw new Error(
            data.error || "AI request failed"
          );

        }

const haivaReply =
  data.reply || "No response received.";

reply.textContent = haivaReply;

status.textContent = "Speaking...";

const speech = new SpeechSynthesisUtterance(haivaReply);

speech.lang = "en-US";
speech.rate = 0.95;
speech.pitch = 1.0;
speech.volume = 1.0;

speech.onstart = function () {
  orb.classList.add("active");
};

speech.onend = function () {
  orb.classList.remove("active");
  status.textContent = "Ready";
};

window.speechSynthesis.cancel();
window.speechSynthesis.speak(speech);

      } catch (error) {

        console.error(error);

        status.textContent = "AI connection error.";

        reply.textContent =
          "Sorry, I couldn't connect to my AI brain.";

      } finally {

        orb.classList.remove("thinking");

      }
    }

    if (!SpeechRecognition) {

      status.textContent =
        "Speech recognition is not supported.";

      micButton.disabled = true;

    } else {

      recognition = new SpeechRecognition();

      recognition.lang = "en-US";
      recognition.continuous = false;
      recognition.interimResults = true;

      recognition.onstart = function () {

        listening = true;

        orb.classList.add("active");
        micButton.classList.add("listening");

        status.textContent = "Listening...";
        transcript.textContent = "Speak now...";

      };

      recognition.onresult = function (event) {

        let finalText = "";
        let interimText = "";

        for (
          let i = event.resultIndex;
          i < event.results.length;
          i++
        ) {

          const text =
            event.results[i][0].transcript;

          if (event.results[i].isFinal) {

            finalText += text;

          } else {

            interimText += text;

          }

        }

        transcript.textContent =
          finalText || interimText;

        if (finalText.trim()) {

          askHAIVA(finalText.trim());

        }

      };

      recognition.onerror = function (event) {

        console.error(
          "Speech recognition error:",
          event.error
        );

        if (event.error === "not-allowed") {

          status.textContent =
            "Microphone permission denied.";

        } else if (event.error === "no-speech") {

          status.textContent =
            "No speech detected.";

        } else {

          status.textContent =
            "Speech error: " + event.error;

        }

      };

      recognition.onend = function () {

        listening = false;

        orb.classList.remove("active");
        micButton.classList.remove("listening");

        if (
          status.textContent === "Listening..."
        ) {

          status.textContent = "Ready";

        }

      };

      micButton.addEventListener(
        "click",
        function () {

          if (listening) {

            recognition.stop();

          } else {

            reply.textContent =
              "Listening for your command...";

            recognition.start();

          }

        }
      );

    }
  </script>

</body>
</html>
