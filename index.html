<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>H.A.I.V.A. Mic Test</title>

  <style>
    body{
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#05070b;
      color:white;
      font-family:Arial,sans-serif;
      text-align:center;
    }

    .box{
      width:90%;
      max-width:420px;
    }

    h1{
      letter-spacing:5px;
    }

    #status{
      margin:30px 0 15px;
      font-weight:bold;
      letter-spacing:3px;
    }

    #heard{
      min-height:60px;
      padding:20px;
      border:1px solid rgba(255,255,255,.15);
      border-radius:20px;
      background:rgba(255,255,255,.05);
      margin-bottom:25px;
    }

    button{
      padding:15px 25px;
      border:0;
      border-radius:30px;
      background:#fff;
      color:#000;
      font-weight:bold;
      font-size:16px;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>H.A.I.V.A.</h1>

  <div id="status">
    READY
  </div>

  <div id="heard">
    Press the button and speak.
  </div>

  <button id="start">
    🎙️ START MICROPHONE
  </button>

</div>

<script>

const status =
  document.getElementById("status");

const heard =
  document.getElementById("heard");

const button =
  document.getElementById("start");


const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


if(!SpeechRecognition){

  status.textContent =
    "NOT SUPPORTED";

  heard.textContent =
    "Speech Recognition is not available in this Chrome environment.";

}
else{

  const recognition =
    new SpeechRecognition();

  recognition.lang =
    "en-US";

  recognition.continuous =
    false;

  recognition.interimResults =
    true;


  recognition.onstart = () => {

    console.log(
      "MICROPHONE STARTED"
    );

    status.textContent =
      "LISTENING";

    heard.textContent =
      "Speak now...";

  };


  recognition.onresult =
    event => {

      let text = "";

      for(
        let i = event.resultIndex;
        i < event.results.length;
        i++
      ){

        text +=
          event.results[i][0].transcript;

      }

      console.log(
        "RECEIVED:",
        text
      );

      heard.textContent =
        text;

    };


  recognition.onerror =
    event => {

      console.error(
        "MIC ERROR:",
        event.error
      );

      status.textContent =
        "ERROR";

      heard.textContent =
        "Microphone error: " +
        event.error;

    };


  recognition.onend = () => {

    console.log(
      "MICROPHONE ENDED"
    );

    status.textContent =
      "READY";

  };


  button.onclick =
    async () => {

      try{

        /*
         * Ask Chrome for microphone
         * permission.
         */

        const stream =
          await navigator
            .mediaDevices
            .getUserMedia({
              audio:true
            });


        /*
         * We only use this to request
         * permission. Stop the stream
         * before SpeechRecognition starts.
         */

        stream
          .getTracks()
          .forEach(
            track =>
              track.stop()
          );


        console.log(
          "MIC PERMISSION OK"
        );


        recognition.start();

      }
      catch(error){

        console.error(
          "MICROPHONE ACCESS FAILED:",
          error
        );

        status.textContent =
          "MIC ERROR";

        heard.textContent =
          error.message;

      }

    };

}

</script>

</body>
</html>
