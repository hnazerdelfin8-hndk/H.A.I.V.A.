<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#030408"
  >

  <title>H.A.I.V.A.</title>


  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }


    body {

      min-height: 100vh;

      overflow: hidden;

      display: flex;

      justify-content: center;

      align-items: center;

      color: white;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background:
        radial-gradient(
          circle at 50% 42%,
          #172033 0%,
          #0a0e18 42%,
          #030408 100%
        );

      transition:
        background 0.5s ease;

    }


    /* =====================================
       APP
    ===================================== */

    #haiva-app {

      width: 100%;

      min-height: 100vh;

      display: flex;

      justify-content: center;

      align-items: center;

      padding: 16px;

    }


    /* =====================================
       MAIN CARD
    ===================================== */

    .haiva-card {

      position: relative;

      width: 100%;

      max-width: 480px;

      height:
        min(720px, 94vh);

      overflow: hidden;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      border:
        1px solid
        rgba(255,255,255,0.10);

      border-radius: 32px;

      background:
        rgba(255,255,255,0.045);

      backdrop-filter:
        blur(28px);

      -webkit-backdrop-filter:
        blur(28px);

      box-shadow:
        0 35px 100px
        rgba(0,0,0,0.55);

    }


    /* =====================================
       DECORATIVE GLOW
    ===================================== */

    .haiva-card::before {

      content: "";

      position: absolute;

      width: 300px;

      height: 300px;

      top: -180px;

      border-radius: 50%;

      background:
        rgba(100,160,255,0.10);

      filter: blur(50px);

      pointer-events: none;

    }


    /* =====================================
       LOGO
    ===================================== */

    .logo {

      position: relative;

      z-index: 2;

      margin-bottom: 55px;

      font-size: 27px;

      font-weight: 700;

      letter-spacing: 7px;

      user-select: none;

      text-shadow:
        0 0 25px
        rgba(255,255,255,0.18);

    }


    /* =====================================
       CORE
    ===================================== */

    .core-wrapper {

      position: relative;

      width: 220px;

      height: 220px;

      display: flex;

      justify-content: center;

      align-items: center;

    }


    .core-ring {

      position: absolute;

      width: 210px;

      height: 210px;

      border-radius: 50%;

      border:
        1px solid
        rgba(150,190,255,0.18);

      animation:
        ringPulse
        3s
        ease-in-out
        infinite;

    }


    .core-ring::before,
    .core-ring::after {

      content: "";

      position: absolute;

      inset: 15px;

      border-radius: 50%;

      border:
        1px solid
        rgba(150,190,255,0.10);

    }


    .core {

      position: relative;

      width: 165px;

      height: 165px;

      display: flex;

      justify-content: center;

      align-items: center;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(255,255,255,0.98) 0%,
          rgba(180,210,255,0.75) 8%,
          rgba(90,145,255,0.28) 30%,
          rgba(40,80,150,0.08) 52%,
          transparent 72%
        );

      box-shadow:
        0 0 35px
        rgba(120,170,255,0.35),
        inset 0 0 35px
        rgba(255,255,255,0.12);

      animation:
        corePulse
        3s
        ease-in-out
        infinite;

    }


    .core::before {

      content: "";

      width: 58px;

      height: 58px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          #ffffff 0%,
          rgba(220,235,255,0.95) 45%,
          rgba(130,180,255,0.35) 100%
        );

      box-shadow:
        0 0 35px
        rgba(255,255,255,0.85);

    }


    /* =====================================
       STATUS
    ===================================== */

    #haiva-status {

      position: relative;

      z-index: 2;

      margin-top: 45px;

      min-height: 20px;

      font-size: 13px;

      font-weight: 700;

      letter-spacing: 4px;

      text-align: center;

      opacity: 0.9;

      transition:
        color 0.3s ease,
        opacity 0.3s ease;

    }


    /* =====================================
       INSTRUCTION
    ===================================== */

    .instruction {

      position: relative;

      z-index: 2;

      width: 90%;

      margin-top: 22px;

      text-align: center;

      font-size: 13px;

      line-height: 1.6;

      opacity: 0.5;

    }


    .instruction p {

      margin: 12px 0 0;

    }


    .instruction strong {

      opacity: 1;

      color: white;

    }


    /* =====================================
       VOICE BUTTON
    ===================================== */

    #activate-voice {

      border:
        1px solid
        rgba(255,255,255,0.16);

      border-radius: 999px;

      padding: 13px 23px;

      color: white;

      background:
        rgba(255,255,255,0.07);

      font-size: 13px;

      font-weight: 600;

      cursor: pointer;

      transition:
        transform 0.2s ease,
        background 0.2s ease,
        box-shadow 0.2s ease;

      box-shadow:
        0 8px 25px
        rgba(0,0,0,0.20);

    }


    #activate-voice:hover {

      background:
        rgba(255,255,255,0.12);

    }


    #activate-voice:active {

      transform:
        scale(0.95);

    }


    #activate-voice.active {

      background:
        rgba(100,160,255,0.18);

      box-shadow:
        0 0 30px
        rgba(100,160,255,0.25);

    }


    /* =====================================
       ANIMATIONS
    ===================================== */

    @keyframes corePulse {

      0%,
      100% {

        transform:
          scale(1);

        opacity:
          0.75;

      }

      50% {

        transform:
          scale(1.07);

        opacity:
          1;

      }

    }


    @keyframes ringPulse {

      0%,
      100% {

        transform:
          scale(0.96);

        opacity:
          0.35;

      }

      50% {

        transform:
          scale(1.08);

        opacity:
          0.8;

      }

    }


    /* =====================================
       LISTENING
    ===================================== */

    body[data-haiva-state="listening"]
    .core {

      animation:
        listeningPulse
        0.8s
        ease-in-out
        infinite;

      box-shadow:
        0 0 80px
        rgba(80,170,255,0.75),
        inset 0 0 40px
        rgba(120,190,255,0.25);

    }


    body[data-haiva-state="listening"]
    .core-ring {

      animation:
        listeningRing
        1s
        linear
        infinite;

    }


    @keyframes listeningPulse {

      0%,
      100% {

        transform:
          scale(1);

      }

      50% {

        transform:
          scale(1.13);

      }

    }


    @keyframes listeningRing {

      from {

        transform:
          rotate(0deg)
          scale(0.96);

      }

      to {

        transform:
          rotate(360deg)
          scale(1.08);

      }

    }


    /* =====================================
       THINKING
    ===================================== */

    body[data-haiva-state="thinking"]
    .core {

      animation:
        thinkingPulse
        0.45s
        ease-in-out
        infinite;

      box-shadow:
        0 0 95px
        rgba(175,100,255,0.75);

    }


    @keyframes thinkingPulse {

      0% {

        transform:
          scale(1)
          rotate(0deg);

      }

      50% {

        transform:
          scale(1.09)
          rotate(180deg);

      }

      100% {

        transform:
          scale(1)
          rotate(360deg);

      }

    }


    /* =====================================
       SPEAKING
    ===================================== */

    body[data-haiva-state="speaking"]
    .core {

      animation:
        speakingPulse
        0.35s
        ease-in-out
        infinite;

      box-shadow:
        0 0 100px
        rgba(255,165,90,0.80);

    }


    @keyframes speakingPulse {

      0%,
      100% {

        transform:
          scale(1);

      }

      50% {

        transform:
          scale(1.18);

      }

    }


    /* =====================================
       ERROR
    ===================================== */

    body[data-haiva-state="error"]
    .core {

      animation:
        errorPulse
        0.6s
        ease-in-out
        infinite;

      box-shadow:
        0 0 90px
        rgba(255,70,70,0.75);

    }


    @keyframes errorPulse {

      0%,
      100% {

        opacity:
          0.55;

      }

      50% {

        opacity:
          1;

      }

    }


    /* =====================================
       MOBILE
    ===================================== */

    @media (max-width: 480px) {

      #haiva-app {

        padding:
          10px;

      }


      .haiva-card {

        height:
          95vh;

        border-radius:
          28px;

      }


      .logo {

        margin-bottom:
          42px;

        font-size:
          23px;

        letter-spacing:
          5px;

      }


      .core-wrapper {

        width:
          190px;

        height:
          190px;

      }


      .core-ring {

        width:
          180px;

        height:
          180px;

      }


      .core {

        width:
          145px;

        height:
          145px;

      }


      .core::before {

        width:
          52px;

        height:
          52px;

      }


      #haiva-status {

        margin-top:
          38px;

      }

    }

  </style>

</head>


<body>

  <div id="haiva-app">

    <main class="haiva-card">

      <div class="logo">
        H.A.I.V.A.
      </div>


      <div class="core-wrapper">

        <div class="core-ring"></div>

        <div
          class="core"
          aria-label="H.A.I.V.A. Core"
        ></div>

      </div>


      <div
        id="haiva-status"
        aria-live="polite"
      >
        BOOTING
      </div>


      <div class="instruction">

        <button
          id="activate-voice"
          type="button"
        >
          🎙️ Activate Voice
        </button>


        <p>

          After activation, say

          <strong>
            "Yi, H.A.I.V.A."
          </strong>

        </p>

      </div>

    </main>

  </div>


  <!-- ===================================
       H.A.I.V.A. CORE
  ==================================== -->

  <script
    type="module"
    src="./core/app.js"
  ></script>

</body>

</html>
