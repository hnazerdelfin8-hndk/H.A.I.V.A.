<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>H.A.I.V.A.</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#f5f5f5;color:#222}body{min-height:100vh}button,input{font:inherit}.app{width:min(100%,640px);min-height:100vh;margin:0 auto;padding:20px 16px;display:flex;flex-direction:column;gap:14px}.header,.status,.voice,.conversation,.settings{background:#fff;border:1px solid #ddd;border-radius:10px}.header{padding:18px}h1{margin:0;font-size:24px}.subtitle{margin:5px 0 0;color:#666;font-size:12px}.status{padding:12px 14px}.status-label{color:#777;font-size:11px;font-weight:bold}#haiva-status{margin-top:4px;font-size:14px}.voice{padding:20px;text-align:center}#orb{width:130px;height:130px;margin:0 auto 12px;border-radius:50%;border:2px solid #bbb;display:flex;align-items:center;justify-content:center;background:#fafafa}.core{width:48px;height:48px;border-radius:50%;background:#ddd}.orb-label,.orb-ring{display:none}#heard{min-height:24px;color:#555;font-size:13px}#activate-voice{width:64px;height:64px;border-radius:50%;border:1px solid #aaa;background:#fff;cursor:pointer;font-size:24px}#activate-voice:active,#send-message:active{transform:scale(.96)}.conversation{padding:16px;min-height:180px;max-height:38vh;overflow:auto}.conversation-head{display:flex;justify-content:space-between;margin-bottom:14px}.conversation-title{font-size:12px;font-weight:bold}.online{font-size:11px;color:#555}.bubble-block{margin-bottom:14px}.label{color:#777;font-size:10px;font-weight:bold;margin-bottom:5px}.bubble{padding:10px;border:1px solid #e0e0e0;border-radius:7px;min-height:38px;white-space:pre-wrap;word-break:break-word;font-size:13px}.chat-form{display:flex;gap:8px}#chat-input{flex:1;min-width:0;padding:13px;border:1px solid #bbb;border-radius:8px;background:#fff;color:#222;outline:none}#send-message{width:54px;border:1px solid #999;border-radius:8px;background:#fff;cursor:pointer;font-size:18px}.settings{padding:12px}#settings-toggle{width:100%;padding:9px;border:1px solid #ccc;border-radius:7px;background:#fafafa;cursor:pointer}#settings-panel{display:none;margin-top:10px}#settings-panel.open{display:block}.setting-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eee;font-size:12px}.setting-value{color:#666}
  </style>
</head>
<body data-haiva-state="booting">
  <main class="app">
    <header class="header"><h1>H.A.I.V.A.</h1><p class="subtitle">HNazer Artificial Intelligence Voice Assistant</p></header>
    <section class="status"><div class="status-label">STATUS</div><div id="haiva-status">BOOTING</div></section>
    <section class="voice" aria-label="Voice control"><div id="orb"><div class="orb-ring"></div><div class="core"></div><div class="orb-label">H.A.I.V.A.</div></div><div id="heard">Initializing H.A.I.V.A. core…</div><button id="activate-voice" type="button" aria-label="Activate H.A.I.V.A." aria-pressed="false">🎙️</button></section>
    <section class="conversation" id="conversation" aria-label="Conversation"><div class="conversation-head"><span class="conversation-title">CONVERSATION</span><span class="online">● CORE READY</span></div><div class="bubble-block"><div class="label">YOU</div><div class="bubble" id="transcript">—</div></div><div class="bubble-block"><div class="label">H.A.I.V.A.</div><div class="bubble" id="reply">Standing by, Master.</div></div></section>
    <form class="chat-form" id="chat-form"><input id="chat-input" type="text" autocomplete="off" placeholder="Type a message" aria-label="Message"><button id="send-message" type="submit" aria-label="Send">➤</button></form>
    <section class="settings"><button id="settings-toggle" type="button" aria-expanded="false">⚙ Settings</button><div id="settings-panel" aria-label="Settings"><div class="setting-row"><span>Voice mode</span><span class="setting-value" id="voice-setting">Tap + Wake Word</span></div><div class="setting-row"><span>Wake word</span><span class="setting-value">Yo, H.A.I.V.A.</span></div><div class="setting-row"><span>Microphone</span><span class="setting-value" id="mic-setting">Checking…</span></div></div></section>
  </main>
  <script type="module" src="./core/app.js"></script>
  <script type="module" src="./core/phase1-controls.js"></script>
</body>
</html>
