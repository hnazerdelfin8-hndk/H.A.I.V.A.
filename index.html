<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#030408">

<title>H.A.I.V.A.</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  min-height: 100%;
}

body {
  min-height: 100vh;
  overflow: hidden;

  display: flex;
  justify-content: center;
  align-items: center;

  color: white;
  font-family: Arial, Helvetica, sans-serif;

  background:
    radial-gradient(
      circle at 50% 42%,
      #172033 0%,
      #0a0e18 42%,
      #030408 100%
    );
}

#haiva-app {
  width: 100%;
  min-height: 100vh;

  display: flex;
  justify-content: center;
  align-items: center;

  padding: 12px;
}

.haiva-card {
  width: 100%;
  max-width: 480px;
  height: min(720px, 94vh);

  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;

  position: relative;
  overflow: hidden;

  border: 1px solid rgba(255,255,255,.1);
  border-radius: 32px;

  background: rgba(255,255,255,.045);

  backdrop-filter: blur(28px);
  -webkit-backdrop-filter: blur(28px);

  box-shadow:
    0 35px 100px rgba(0,0,0,.55);
}

.logo {
  margin-bottom: 50px;

  font-size: 27px;
  font-weight: 700;
  letter-spacing: 7px;

  text-shadow:
    0 0 25px rgba(255,255,255,.18);
}

.core-wrapper {
  width: 220px;
  height: 220px;

  display: flex;
  justify-content: center;
  align-items: center;

  position: relative;
}

.core-ring {
  position: absolute;

  width: 210px;
  height: 210px;

  border-radius: 50%;

  border: 1px solid rgba(150,190,255,.18);

  animation:
    ringPulse 3s ease-in-out infinite;
}

.core-ring::before,
.core-ring::after {
  content: "";

  position: absolute;
  inset: 15px;

  border-radius: 50%;

  border: 1px solid rgba(150,190,255,.1);
}

.core {
  width: 165px;
  height: 165px;

  position: relative;

  display: flex;
  justify-content: center;
  align-items: center;

  border-radius: 50%;

  background:
    radial-gradient(
      circle,
      rgba(255,255,255,.98) 0%,
      rgba(180,210,255,.75) 8%,
      rgba(90,145,255,.28) 30%,
      rgba(40,80,150,.08) 52%,
      transparent 72%
    );

  box-shadow:
    0 0 35px rgba(120,170,255,.35),
    inset 0 0 35px rgba(255,255,255,.12);

  animation:
    corePulse 3s ease-in-out infinite;
}

.core::before {
  content: "";

  width: 58px;
  height: 58px;

  border-radius: 50%;

  background:
    radial-gradient(
      circle,
      #fff 0%,
      rgba(220,235,255,.95) 45%,
      rgba(130,180,255,.35) 100%
    );

  box-shadow:
    0 0 35px rgba(255,255,255,.85);
}

#haiva-status {
  margin-top: 40px;

  min-height: 20px;

  font-size: 13px;
  font-weight: 700;

  letter-spacing: 4px;
  text-align: center;

  opacity: .9;
}

#haiva-response {
  width: 88%;
  min-height: 25px;

  margin-top: 18px;

  text-align: center;

  font-size: 14px;
  line-height: 1.5;

  opacity: .75;
}

.instruction {
  margin-top: 28px;

  width: 90%;

  text-align: center;

  font-size: 13px;

  opacity: .55;
}

#activate-voice {
  border: 1px solid rgba(255,255,255,.16);
  border-radius: 999px;

  padding: 13px 23px;

  color: white;
  background: rgba(255,255,255,.07);

  font-size: 13px;
  font-weight: 600;

  cursor: pointer;

  transition:
    transform .2s ease,
    background .2s ease,
    box-shadow .2s ease;
}

#activate-voice:active {
  transform: scale(.95);
}

#activate-voice.active {
  background: rgba(100,160,255,.18);

  box-shadow:
    0 0 30px rgba(100,160,255,.25);
}

/* LISTENING */

body.listening .core {
  animation:
    listeningPulse .8s ease-in-out infinite;

  box-shadow:
    0 0 80px rgba(80,170,255,.75),
    inset 0 0 40px rgba(120,190,255,.25);
}

body.listening .core-ring {
  animation:
    listeningRing 1s linear infinite;
}

/* THINKING */

body.thinking .core {
  animation:
    thinkingPulse .45s ease-in-out infinite;

  box-shadow:
    0 0 95px rgba(175,100,255,.75);
}

/* SPEAKING */

body.speaking .core {
  animation:
    speakingPulse .35s ease-in-out infinite;

  box-shadow:
    0 0 100px rgba(255,165,90,.8);
}

/* ERROR */

body.error .core {
  animation:
    errorPulse .6s ease-in-out infinite;

  box-shadow:
    0 0 90px rgba(255,70,70,.75);
}

@keyframes corePulse {
  0%,100% {
    transform: scale(1);
    opacity: .75;
  }

  50% {
    transform: scale(1.07);
    opacity: 1;
  }
}

@keyframes ringPulse {
  0%,100% {
    transform: scale(.96);
    opacity: .35;
  }

  50% {
    transform: scale(1.08);
    opacity: .8;
  }
}

@keyframes listeningPulse {
  0%,100% {
    transform: scale(1);
  }

  50% {
    transform: scale(1.13);
  }
}

@keyframes listeningRing {
  from {
    transform: rotate(0deg) scale(.96);
  }

  to {
    transform: rotate(360deg) scale(1.08);
  }
}

@keyframes thinkingPulse {
  0% {
    transform: scale(1) rotate(0deg);
  }

  50% {
    transform: scale(1.09) rotate(180deg);
  }

  100% {
    transform: scale(1) rotate(360deg);
  }
}

@keyframes speakingPulse {
  0%,100% {
    transform: scale(1);
  }

  50% {
    transform: scale(1.18);
  }
}

@keyframes errorPulse {
  0%,100% {
    opacity: .55;
  }

  50% {
    opacity: 1;
  }
}

@media (max-width:480px) {

  .haiva-card {
    height: 95vh;
    border-radius: 28px;
  }

  .logo {
    margin-bottom: 42px;
    font-size: 23px;
    letter-spacing: 5px;
  }

  .core-wrapper {
    width: 190px;
    height: 190px;
  }

  .core-ring {
    width: 180px;
    height: 180px;
  }

  .core {
    width: 145px;
    height: 145px;
  }

  .core::before {
    width: 52px;
    height: 52px;
  }
}
</style>
</head>

<body>

<div id="haiva-app">

  <main class="haiva-card">

    <div class="logo">
      H.A.I.V.A.
    </div>

    <div class="core-wrapper">

      <div class="core-ring"></div>

      <div
        class="core"
        aria-label="H.A.I.V.A. Core">
      </div>

    </div>

    <div id="haiva-status">
      STANDBY
    </div>

    <div id="haiva-response">
      Ready.
    </div>

    <div class="instruction">

      <button
        id="activate-voice"
        type="button">
        🎙️ Activate Voice
      </button>

      <p>
        Say
        <strong>"Yi, H.A.I.V.A."</strong>
        then your command.
      </p>

    </div>

  </main>

</div>


<script>

const statusElement =
  document.getElementById("haiva-status");

const responseElement =
  document.getElementById("haiva-response");

const button =
  document.getElementById("activate-voice");


let recognition = null;

let active = false;

let waitingForCommand = false;

let speaking = false;


function setState(state) {

  document.body.className =
    state.toLowerCase();

  statusElement.textContent =
    state;

}


function showResponse(text) {

  responseElement.textContent =
    text;

}


function speak(text) {

  return new Promise(resolve => {

    if (
      !("speechSynthesis" in window)
    ) {

      resolve();

      return;

    }


    speechSynthesis.cancel();


    speaking = true;

    setState("SPEAKING");


    const voice =
      new SpeechSynthesisUtterance(text);


    voice.lang = "en-US";

    voice.rate = 0.95;

    voice.pitch = 1.0;

    voice.volume = 1.0;


    voice.onend = () => {

      speaking = false;

      resolve();

    };


    voice.onerror = () => {

      speaking = false;

      resolve();

    };


    speechSynthesis.speak(voice);

  });

}


function normalize(text) {

  return text
    .toLowerCase()
    .replace(/[.,!?]/g, "")
    .replace(/\s+/g, " ")
    .trim();

}


function hasWakeWord(text) {

  const wakeWords = [

    "yo haiva",
    "hey haiva",
    "hi haiva",
    "yi haiva",
    "haiva"

  ];


  return wakeWords.some(
    word => text.includes(word)
  );

}


function removeWakeWord(text) {

  const wakeWords = [

    "yo haiva",
    "hey haiva",
    "hi haiva",
    "yi haiva",
    "haiva"

  ];


  let result = text;


  wakeWords.forEach(word => {

    result =
      result.replace(
        word,
        ""
      );

  });


  return result.trim();

}


async function processCommand(command) {

  command =
    normalize(command);


  if (!command) {

    await speak(
      "Yes, Master. I'm listening."
    );

    waitingForCommand = true;

    setState("LISTENING");

    return;

  }


  setState("THINKING");


  showResponse(
    "Processing..."
  );


  /*
   * LOCAL TEST RESPONSES
   *
   * These prove that the complete
   * voice → command → response →
   * speech system is working.
   */

  let answer = "";


  if (
    command.includes("hello") ||
    command.includes("hi")
  ) {

    answer =
      "Hello, Master. How can I help you?";

  }

  else if (
    command.includes("who are you")
  ) {

    answer =
      "I am H.A.I.V.A., your artificial intelligence voice assistant.";

  }

  else if (
    command.includes("what time")
  ) {

    answer =
      "The current time is " +
      new Date().toLocaleTimeString(
        [],
        {
          hour: "numeric",
          minute: "2-digit"
        }
      ) + ".";

  }

  else if (
    command.includes("what date") ||
    command.includes("what day")
  ) {

    answer =
      "Today is " +
      new Date().toLocaleDateString(
        [],
        {
          weekday: "long",
          month: "long",
          day: "numeric",
          year: "numeric"
        }
      ) + ".";

  }

  else {

    answer =
      "I heard you say " +
      command +
      ", Master.";

  }


  showResponse(
    answer
  );


  await speak(
    answer
  );


  waitingForCommand =
    false;


  setState("STANDBY");

}


function handleSpeech(event) {

  let text = "";


  for (
    let i = event.resultIndex;
    i < event.results.length;
    i++
  ) {

    text +=
      event.results[i][0].transcript;

  }


  text =
    normalize(text);


  if (!text) {
    return;
  }


  console.log(
    "H.A.I.V.A. heard:",
    text
  );


  if (!waitingForCommand) {

    if (
      hasWakeWord(text)
    ) {

      const command =
        removeWakeWord(text);


      waitingForCommand =
        true;


      setState(
        "LISTENING"
      );


      if (command) {

        processCommand(
          command
        );

      }

      else {

        speak(
          "Yes, Master. I'm listening."
        );

      }

    }


    return;

  }


  processCommand(
    text
  );

}


function startRecognition() {

  if (
    !recognition ||
    !active
  ) {

    return;

  }


  try {

    recognition.start();

  } catch (error) {

    console.log(
      "Recognition already running."
    );

  }

}


function setupRecognition() {

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  if (!SpeechRecognition) {

    setState(
      "VOICE UNAVAILABLE"
    );


    showResponse(
      "Speech recognition is not supported by this browser."
    );


    return;

  }


  recognition =
    new SpeechRecognition();


  recognition.lang =
    "en-US";


  recognition.continuous =
    true;


  recognition.interimResults =
    false;


  recognition.onstart =
    () => {

      console.log(
        "H.A.I.V.A. microphone active."
      );

      setState(
        waitingForCommand
          ? "LISTENING"
          : "STANDBY"
      );

    };


  recognition.onresult =
    handleSpeech;


  recognition.onerror =
    event => {

      console.warn(
        "Speech error:",
        event.error
      );


      if (
        event.error ===
        "not-allowed"
      ) {

        setState(
          "MICROPHONE DENIED"
        );

        showResponse(
          "Please allow microphone access in Chrome."
        );

      }

    };


  recognition.onend =
    () => {

      if (active) {

        setTimeout(
          startRecognition,
          600
        );

      }

    };

}


button.addEventListener(
  "click",
  async () => {

    if (active) {
      return;
    }


    setupRecognition();


    if (!recognition) {
      return;
    }


    try {

      /*
       * The button click gives Chrome
       * the user gesture needed to
       * request microphone access.
       */

      if (
        navigator.mediaDevices &&
        navigator.mediaDevices.getUserMedia
      ) {

        const stream =
          await navigator.mediaDevices
            .getUserMedia({
              audio: true
            });


        stream
          .getTracks()
          .forEach(
            track =>
              track.stop()
          );

      }


      active = true;

      button.classList.add(
        "active"
      );

      button.textContent =
        "🎙️ Voice Active";


      showResponse(
        'Say "Yi, H.A.I.V.A."'
      );


      await speak(
        "H.A.I.V.A. is ready."
      );


      setState(
        "STANDBY"
      );


      startRecognition();

    } catch (error) {

      console.error(
        error
      );


      setState(
        "MICROPHONE DENIED"
      );


      showResponse(
        "Microphone access is required."
      );

    }

  }
);


setState(
  "STANDBY"
);

</script>

</body>
</html>
