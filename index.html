<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>H.A.I.V.A.</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #050505;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app {
      width: 100%;
      max-width: 500px;
      min-height: 100vh;
      padding: 35px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      text-align: center;
      margin-top: 30px;
    }

    .logo h1 {
      margin: 0;
      font-size: 42px;
      letter-spacing: 6px;
    }

    .logo p {
      margin-top: 10px;
      color: #aaa;
      font-size: 13px;
      letter-spacing: 2px;
    }

    .orb {
      width: 190px;
      height: 190px;
      border-radius: 50%;
      border: 2px solid #777;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      box-shadow: 0 0 35px rgba(255,255,255,0.15);
      transition: 0.3s;
    }

    .orb::before {
      content: "";
      width: 130px;
      height: 130px;
      border-radius: 50%;
      border: 1px solid #555;
      position: absolute;
    }

    .orb.active {
      animation: pulse 1.2s infinite;
      box-shadow: 0 0 50px rgba(255,255,255,0.45);
    }

    .orb.thinking {
      animation: thinking 0.8s infinite;
      box-shadow: 0 0 70px rgba(100,180,255,0.5);
    }

    .orb.speaking {
      animation: speaking 0.55s infinite;
      box-shadow: 0 0 80px rgba(100,180,255,0.65);
    }

    .orb-text {
      z-index: 2;
      font-size: 18px;
      letter-spacing: 3px;
    }

    @keyframes pulse {
      0% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.06);
      }

      100% {
        transform: scale(1);
      }
    }

    @keyframes thinking {
      0% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.04);
      }

      100% {
        transform: scale(1);
      }
    }

    @keyframes speaking {
      0% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.08);
      }

      100% {
        transform: scale(1);
      }
    }

    .conversation {
      width: 100%;
      min-height: 180px;
      text-align: center;
      font-size: 15px;
      line-height: 1.5;
    }

    .label {
      color: #777;
      font-size: 11px;
      letter-spacing: 2px;
      margin-bottom: 7px;
    }

    #status {
      color: #aaa;
      margin-bottom: 18px;
    }

    #transcript,
    #reply {
      min-height: 40px;
      padding: 0 10px;
      margin-bottom: 15px;
    }

    #reply {
      color: #ddd;
    }

    .mic-button {
      width: 85px;
      height: 85px;
      border-radius: 50%;
      border: 2px solid white;
      background: transparent;
      color: white;
      font-size: 32px;
      cursor: pointer;
      margin-bottom: 30px;
    }

    .mic-button:active {
      transform: scale(0.94);
    }

    .mic-button.listening {
      animation: micPulse 1s infinite;
    }

    .mic-button.active {
      border-color: #66b6ff;
      box-shadow: 0 0 30px rgba(100,180,255,0.5);
    }

    @keyframes micPulse {
      0% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.08);
      }

      100% {
        transform: scale(1);
      }
    }

    .hint {
      color: #555;
      font-size: 10px;
      margin-top: -15px;
      margin-bottom: 15px;
      text-align: center;
    }
  </style>
</head>

<body>

  <main class="app">

    <section class="logo">
      <h1>H.A.I.V.A.</h1>
      <p>HNazer Artificial Intelligence Voice Assistant</p>
    </section>

    <section>
      <div class="orb" id="orb">
        <div class="orb-text">HAIVA</div>
      </div>
    </section>

    <section class="conversation">

      <div class="label">STATUS</div>
      <div id="status">Ready</div>

      <div class="label">YOU SAID</div>
      <div id="transcript">
        Say "Yo HAIVA" to begin.
      </div>

      <div class="label">HAIVA</div>
      <div id="reply">
        Standing by.
      </div>

    </section>

    <button
      class="mic-button"
      id="micButton"
      aria-label="Start HAIVA">
      🎙️
    </button>

    <div class="hint">
      Tap once to activate conversation mode
    </div>

  </main>

  <script>
    const micButton = document.getElementById("micButton");
    const orb = document.getElementById("orb");
    const status = document.getElementById("status");
    const transcript = document.getElementById("transcript");
    const reply = document.getElementById("reply");

    const SpeechRecognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;

    let recognition = null;

    let conversationMode = false;
    let listening = false;
    let processing = false;
    let speaking = false;

    let silenceTimer = null;

    /*
      Wake phrase.
      User can say:
      "Yo HAIVA"
      "Hey HAIVA"
      "HAIVA"
    */

    const wakeWords = [
      "yo haiva",
      "hey haiva",
      "hi haiva",
      "haiva"
    ];

    function containsWakeWord(text) {
      const lower = text.toLowerCase();

      return wakeWords.some(word =>
        lower.includes(word)
      );
    }

    function removeWakeWord(text) {
      let result = text;

      wakeWords.forEach(word => {
        result = result.replace(
          new RegExp(word, "ig"),
          ""
        );
      });

      return result.trim();
    }

    function startListening() {

      if (!recognition) return;

      if (
        listening ||
        processing ||
        speaking ||
        !conversationMode
      ) {
        return;
      }

      try {

        recognition.start();

      } catch (error) {

        console.log(
          "Recognition already running."
        );

      }
    }

    function stopListening() {

      if (!recognition) return;

      try {
        recognition.stop();
      } catch (error) {
        console.log(error);
      }
    }

    function restartListening() {

      if (!conversationMode) return;

      clearTimeout(silenceTimer);

      setTimeout(() => {

        if (
          conversationMode &&
          !processing &&
          !speaking &&
          !listening
        ) {
          startListening();
        }

      }, 350);

    }

    async function askHAIVA(message) {

      processing = true;

      status.textContent = "Thinking...";

      orb.classList.remove("active");
      orb.classList.add("thinking");

      try {

        const response = await fetch(
          "/api/chat",
          {
            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({
              message: message
            })
          }
        );

        const data = await response.json();

        if (!response.ok) {

          throw new Error(
            data.error ||
            "AI request failed"
          );

        }

        const haivaReply =
          data.reply ||
          "No response received.";

        reply.textContent =
          haivaReply;

        /*
          Stop recognition before HAIVA speaks.
          This prevents HAIVA from hearing
          its own voice.
        */

        stopListening();

        speaking = true;

        status.textContent =
          "Speaking...";

        orb.classList.remove(
          "thinking"
        );

        orb.classList.add(
          "speaking"
        );

        const speech =
          new SpeechSynthesisUtterance(
            haivaReply
          );

        /*
          Filipino-friendly voice settings.
        */

        speech.lang = "fil-PH";
        speech.rate = 0.95;
        speech.pitch = 1.0;
        speech.volume = 1.0;

        speech.onstart = function () {

          speaking = true;

          status.textContent =
            "Speaking...";

        };

        speech.onend = function () {

          speaking = false;
          processing = false;

          orb.classList.remove(
            "speaking"
          );

          status.textContent =
            conversationMode
              ? "Listening..."
              : "Ready";

          /*
            Automatically listen again.
          */

          restartListening();

        };

        speech.onerror = function () {

          speaking = false;
          processing = false;

          orb.classList.remove(
            "speaking"
          );

          status.textContent =
            conversationMode
              ? "Listening..."
              : "Ready";

          restartListening();

        };

        window.speechSynthesis.cancel();

        window.speechSynthesis.speak(
          speech
        );

      } catch (error) {

        console.error(error);

        processing = false;

        status.textContent =
          "AI connection error.";

        reply.textContent =
          "Sorry, I couldn't connect to my AI brain.";

        orb.classList.remove(
          "thinking"
        );

        restartListening();

      }
    }

    if (!SpeechRecognition) {

      status.textContent =
        "Speech recognition is not supported.";

      micButton.disabled = true;

    } else {

      recognition =
        new SpeechRecognition();

      /*
        Continuous mode helps keep
        the conversation alive.

        Some mobile browsers may still
        restart recognition automatically.
      */

      recognition.continuous = false;
      recognition.interimResults = true;

      /*
        Filipino + English.
        The browser will recognize
        common Taglish reasonably well.
      */

      recognition.lang = "en-US";

      recognition.onstart = function () {

        listening = true;

        orb.classList.add("active");

        micButton.classList.add(
          "listening"
        );

        micButton.classList.add(
          "active"
        );

        status.textContent =
          "Listening...";

        transcript.textContent =
          "I'm listening...";

      };

      recognition.onresult =
        function(event) {

          let finalText = "";
          let interimText = "";

          for (
            let i = event.resultIndex;
            i < event.results.length;
            i++
          ) {

            const text =
              event.results[i][0]
                .transcript;

            if (
              event.results[i].isFinal
            ) {

              finalText += text;

            } else {

              interimText += text;

            }
          }

          const shownText =
            finalText ||
            interimText;

          transcript.textContent =
            shownText;

          /*
            If the user says the wake phrase,
            activate conversation mode.
          */

          if (
            containsWakeWord(shownText)
          ) {

            conversationMode = true;

            micButton.textContent =
              "⏹️";

            status.textContent =
              "HAIVA activated";

            /*
              Remove wake word.

              Example:
              "Yo HAIVA what time is it?"
              becomes:
              "what time is it?"
            */

            const command =
              removeWakeWord(
                shownText
              );

            /*
              If there is an actual command
              after the wake phrase, send it.
            */

            if (
              finalText &&
              command.length > 0
            ) {

              askHAIVA(command);

            } else {

              reply.textContent =
                "Yes, master?";

              restartListening();

            }

            return;
          }

          /*
            Once conversation mode is active,
            every final sentence becomes
            a command.
          */

          if (
            conversationMode &&
            finalText.trim()
          ) {

            askHAIVA(
              finalText.trim()
            );

          }
        };

      recognition.onerror =
        function(event) {

          console.error(
            "Speech recognition error:",
            event.error
          );

          listening = false;

          orb.classList.remove(
            "active"
          );

          micButton.classList.remove(
            "listening"
          );

          if (
            event.error ===
            "not-allowed"
          ) {

            status.textContent =
              "Microphone permission denied.";

            conversationMode = false;

            return;
          }

          if (
            event.error ===
            "no-speech"
          ) {

            if (
              conversationMode &&
              !processing &&
              !speaking
            ) {

              status.textContent =
                "Listening...";

              restartListening();

            } else {

              status.textContent =
                "Ready";

            }

            return;
          }

          status.textContent =
            "Microphone reconnecting...";

          if (
            conversationMode &&
            !processing &&
            !speaking
          ) {

            restartListening();

          }
        };

      recognition.onend =
        function() {

          listening = false;

          orb.classList.remove(
            "active"
          );

          micButton.classList.remove(
            "listening"
          );

          /*
            Automatically restart the
            microphone after recognition ends.
          */

          if (
            conversationMode &&
            !processing &&
            !speaking
          ) {

            status.textContent =
              "Listening...";

            restartListening();

          } else if (
            !conversationMode
          ) {

            status.textContent =
              "Ready";
          }
        };

      /*
        ONE TAP ONLY.

        Tap once:
        conversation ON

        Tap again:
        conversation OFF
      */

      micButton.addEventListener(
        "click",
        function() {

          if (
            conversationMode
          ) {

            conversationMode =
              false;

            processing = false;

            stopListening();

            window.speechSynthesis.cancel();

            speaking = false;

            orb.classList.remove(
              "active"
            );

            orb.classList.remove(
              "thinking"
            );

            orb.classList.remove(
              "speaking"
            );

            micButton.classList.remove(
              "active"
            );

            micButton.classList.remove(
              "listening"
            );

            micButton.textContent =
              "🎙️";

            status.textContent =
              "Ready";

            transcript.textContent =
              'Say "Yo HAIVA" to begin.';

            reply.textContent =
              "Standing by.";

          } else {

            conversationMode =
              true;

            micButton.textContent =
              "⏹️";

            reply.textContent =
              "Yes, master?";

            status.textContent =
              "Listening...";

            startListening();

          }

        }
      );
    }
  </script>

</body>
</html>
