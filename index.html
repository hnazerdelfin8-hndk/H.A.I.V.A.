<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>H.A.I.V.A.</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #05070b;
      color: #fff;
      font-family: Arial, sans-serif;
    }
    .box { width: min(92vw, 520px); text-align: center; }
    h1 { margin: 0 0 8px; letter-spacing: 6px; }
    .subtitle { opacity: .6; margin-bottom: 28px; }
    #haiva-status {
      margin: 0 0 16px;
      font-weight: 700;
      letter-spacing: 3px;
    }
    #heard {
      min-height: 74px;
      padding: 20px;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 20px;
      background: rgba(255,255,255,.05);
      margin-bottom: 20px;
      line-height: 1.5;
    }
    button {
      padding: 15px 25px;
      border: 0;
      border-radius: 30px;
      background: #fff;
      color: #000;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
    }
    button.active { opacity: .75; }
  </style>
</head>
<body>
  <main class="box">
    <h1>H.A.I.V.A.</h1>
    <div class="subtitle">Hnazer Artificial Intelligence Voice Assistant</div>

    <div id="haiva-status">BOOTING</div>

    <div id="heard">Press “Activate Voice” to give H.A.I.V.A. microphone permission.</div>

    <button id="activate-voice" type="button">🎙️ Activate Voice</button>
  </main>

  <!-- The real H.A.I.V.A. engine owns recognition, wake-word detection,
       routing, OpenAI requests, and speech output. -->
  <script type="module" src="./core/app.js"></script>
</body>
</html>
